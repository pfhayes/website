# journald's default cap is 10% of the filesystem — on this instance's ~7GB
# root disk that is ~680MB, which patrick-web's request log fills on its own.
# SystemMaxFileSize keeps individual journals small enough that the cap evicts
# at a useful granularity instead of dropping one 64MB file at a time.
[Journal]
SystemMaxUse=100M
SystemMaxFileSize=16M
